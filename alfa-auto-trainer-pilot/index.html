<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1С:Альфа-Авто 6.1 · Рабочий стол первой линии CRM · учебная копия</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app">
  <header class="app-head">
    <div class="global-yellow"><span class="app-mark">1С</span><button type="button" class="global-hamburger" id="menu-btn" aria-label="Меню разделов">☰</button><span class="global-brand">Альфа-Авто: Автосалон + Автосервис + Автозапчасти КОРП</span><span class="global-meta">Учебная копия • данные вымышлены</span><button class="global-gear" id="training-toggle" type="button" title="Параметры обучения">◈&nbsp; Обучение</button></div>
    <nav class="workspace-tabs" id="nav" aria-label="Открытые документы"></nav>
  </header>
  <main id="main-content" tabindex="-1"></main>
  <section id="training-dock" class="training-dock collapsed" aria-label="Учебная панель">
    <div class="training-title"><strong>Тренажёр — параметры занятия</strong><button type="button" id="training-close" title="Свернуть">×</button></div>
    <div class="training-controls"><label>Сотрудник / роль <select id="role-picker"></select></label><label>Режим <select id="mode-picker"></select></label><button id="reset-btn" type="button">Новый сценарий</button></div>
    <div class="training-context">Учебный клиент: ООО «Транспорт-Альфа» · Петров Алексей · КАМАЗ 65115 · посторонний шум при торможении. Все действия выполняются только в браузере.</div>
    <div id="next-step" class="training-next"></div><div id="help-content" class="training-help"></div>
  </section>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>
<script src="engine.js"></script><script src="app.js"></script>
</body>
</html>
