<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Альфа-Авто 6.1 — учебная тестовая версия</title><style>
*{box-sizing:border-box}body{margin:0;color:#333;background:#eff0f2;font:15px Arial,sans-serif}header{background:#fafafa;border-bottom:1px solid #aaa;padding:16px 23px}header strong{font-size:22px;color:#9c3124}header small{display:block;color:#666;padding-top:4px}nav{padding:10px 20px;background:#fff;border-bottom:1px solid #ddd}button{cursor:pointer;background:#fafafa;border:1px solid #aaa;padding:10px 14px;border-radius:3px;color:#333;margin:3px}button:hover{background:#fff0b9}button.sel{background:#f5d57a;border-color:#cfb45e}main{max-width:1040px;background:white;margin:24px auto;padding:25px;border:1px solid #ccc;min-height:600px}h1{font-size:24px;font-weight:500}h2{font-size:19px;font-weight:500}.warn{background:#fff3da;border-left:4px solid #d5ad45;padding:14px;line-height:1.5}.msg{border:1px solid #ccc;background:#f7f7f7;padding:20px;margin:22px 0}.answers{display:flex;flex-direction:column;align-items:start}.answers button{min-width:260px;text-align:left}.progress{height:8px;background:#eee;margin:20px 0}.progress div{height:100%;background:#d7b04c}.ok{background:#e7f5e8;padding:10px}.error{background:#fff0ef;padding:10px}.tile{width:250px;height:90px;text-align:left;vertical-align:top}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}@media(max-width:700px){main{margin:0;padding:14px}nav button{padding:7px}}
</style><header><strong>1С · Альфа-Авто 6.1</strong><small>Временный интерактивный прототип — без подключения к рабочей 1С</small></header><nav><button data-page="home">Главная</button><button data-page="lessons">8 уроков</button><button data-page="exams">4 экзамена</button><button data-page="history">Прогресс</button><button data-page="videos">Видео</button></nav><main id="app"></main><script>
const mods=[
['Рабочий стол',['Открыть рабочий стол первой линии CRM','Настроить фильтр «Ответственные»','Принять задачу группы']],
['Документ «Событие»',['Создать событие','Указать контактное лицо','Выбрать причину обращения','Заполнить договорённость с клиентом','Создать запись на ремонт']],
['Задача CRM',['Создать задачу CRM','Выбрать группу КО','Указать вид и тему телефонной задачи','Заполнить даты либо «Общий вопрос»','Записать и закрыть']],
['Калькуляция',['Принять задачу КП','Открыть калькуляцию','Заполнить автоработы и товары','Передать на проценку','Установить статус «Согласование»','Согласовать с клиентом']],
['Экспресс заказ-наряд',['Создать событие','Открыть «Экспресс ЗН»','Выбрать вид «Экспресс агрегат»','Указать номер агрегата','Оформить заказ-наряд']],
['Мессенджер MAX',['Проверить контакт и контрагента','Нажать «MAX»','Отправить приглашение','Проверить согласие на обработку ПД']],
['Блокировка контрагента',['Сохранить изменения','Открыть вкладку «Разблокировка»','Указать сумму и комментарий','Отправить на согласование','Продолжить после решения']],
['Email из 1С',['Открыть печатную форму','Нажать «Отправить письмо»','Проверить реквизиты и PDF','Отправить письмо']]
];
const ex=[['Клиент пришёл',1],['Входящий звонок',1],['Исходящий звонок',2],['Передача в КО',2]];
let view='home',kind='lesson',which=0,step=0,errors=0,hints=0,message='';
let db={completed:[],attempts:[]};try{const v=JSON.parse(localStorage.getItem('ea-trainer-temporary-preview')||'{}');if(Array.isArray(v.completed)&&Array.isArray(v.attempts))db=v}catch(e){}
const save=()=>localStorage.setItem('ea-trainer-temporary-preview',JSON.stringify(db));
const el=()=>document.getElementById('app');
const clean=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){let h='';
if(view==='home')h='<h1>Учебный тренажёр мастера-приёмщика</h1><div class="warn"><b>Важное ограничение:</b> это временная реконструкция по инструкциям, а не восстановленная исходная v13.1. Формы не являются попиксельной копией реальной 1С; видеозаписи из исходного архива недоступны. Данные клиентов и документы не создаются.</div><h2>Что можно проверить</h2><button data-page="lessons" class="tile">8 интерактивных учебных модулей</button><button data-page="exams" class="tile">4 экзамена с оценкой</button><button data-page="history" class="tile">Журнал и экспорт результатов CSV</button>';
if(view==='lessons'||view==='exams'){let is=view==='lessons',list=is?mods:ex;h='<h1>'+(is?'Учебные модули':'Экзамены')+'</h1><p>Выберите сценарий для интерактивной проверки последовательности действий.</p>'+list.map((x,i)=>'<button class="tile" data-'+(is?'lesson':'exam')+'="'+i+'">'+(i+1)+'. '+clean(x[0])+'</button>').join('')}
if(view==='videos')h='<h1>Видеоуроки</h1><div class="warn">В манифесте оригинала v13.1 указаны три MP4 и три VTT, однако сами видеозаписи недоступны для публикации. Видео в данном прототипе не подменялись пустыми плеерами.</div><p>Темы: входящий звонок и календарь; передача события в КО; работа КО в Bitrix24.</p>';
if(view==='history'){h='<h1>Прогресс и журнал</h1><p>Завершено модулей: '+new Set(db.completed).size+' из 8. Экзаменов: '+db.attempts.length+'.</p><button id="csv">Экспорт CSV</button><table><tr><th>Дата</th><th>Экзамен</th><th>Оценка</th></tr>'+db.attempts.map(a=>'<tr><td>'+clean(a.date)+'</td><td>'+clean(a.name)+'</td><td>'+a.score+'</td></tr>').join('')+'</table>'}
if(view==='run'){const src=kind==='lesson'?mods[which]:mods[ex[which][1]],arr=src[1];if(step>=arr.length){if(kind==='lesson'){db.completed.push(which);save();h='<h1>Урок завершён</h1><p class="ok">Последовательность действий пройдена.</p><button data-page="lessons">К урокам</button>'}else{let score=Math.max(0,100-errors*5-hints*2);db.attempts.push({date:new Date().toLocaleString('ru-RU'),name:ex[which][0],score});save();h='<h1>Экзамен завершён</h1><h2>Оценка: '+score+' / 100</h2><p>Ошибки: '+errors+'. Подсказки: '+hints+'.</p><button data-page="history">Открыть журнал</button>'}view='done'}else{let choices=[arr[step],...arr.filter(x=>x!==arr[step]).slice(0,3)];let offset=(which+step)%choices.length;choices.push(...choices.splice(0,offset));h='<h1>'+(kind==='lesson'?clean(src[0]):clean(ex[which][0]))+'</h1><p>Шаг '+(step+1)+' из '+arr.length+'</p><div class="progress"><div style="width:'+(step/arr.length*100)+'%"></div></div><div class="msg"><h2>Рабочее задание 1С</h2><p>Выберите действие для продолжения бизнес-процесса.</p><div class="answers">'+choices.map(c=>'<button data-action="'+clean(c)+'">'+clean(c)+'</button>').join('')+'</div><button id="hint">Подсказка '+(kind==='exam'?'(−2 балла)':'')+'</button><button id="restart">Начать заново</button>'+(message?'<p class="'+(message==='Верно'?'ok':'error')+'">'+message+'</p>':'')+'</div><p style="color:#777">Действия моделируются локально. Для реальной работы необходимо исходное приложение.</p>'}}
el().innerHTML=h}
function begin(k,i){view='run';kind=k;which=i;step=0;errors=0;hints=0;message='';draw()}
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b)return;if(b.dataset.page){view=b.dataset.page;message='';draw()}else if(b.dataset.lesson!==undefined)begin('lesson',Number(b.dataset.lesson));else if(b.dataset.exam!==undefined)begin('exam',Number(b.dataset.exam));else if(b.dataset.action!==undefined){const list=(kind==='lesson'?mods[which]:mods[ex[which][1]])[1];if(b.dataset.action===list[step]){step++;message='Верно'}else{errors++;message='Неверное действие. Попробуйте ещё раз'}draw()}else if(b.id==='hint'){hints++;message='Сопоставьте действие с порядком работы по инструкции';draw()}else if(b.id==='restart')begin(kind,which);else if(b.id==='csv'){let rows=[['Дата','Экзамен','Оценка'],...db.attempts.map(a=>[a.date,a.name,a.score])];let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v).replace(/^([=+\-@])/,"'$1").replace(/"/g,'""')+'"').join(';')).join('\r\n');let u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='exam-history.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}});draw();
</script></html>
