.messenger{display:grid;grid-template-columns:340px minmax(0,1fr);height:calc(100dvh - 220px);min-height:300px;border:1px solid #d6d9df;border-radius:18px;overflow:hidden;background:#fff}
.messenger button{font:inherit;border:0;background:transparent;color:#283342;cursor:pointer;min-height:42px}
.messenger button:disabled{opacity:.45;cursor:wait}
.msg-sidebar{min-height:0;display:flex;flex-direction:column;border-right:1px solid #d6d9df;background:#fff}
.msg-sidebar-head{display:flex;gap:8px;align-items:center;padding:12px 16px}
.msg-sidebar-head h2{margin:0;flex:1;font-size:24px;letter-spacing:-.02em}
.msg-sidebar-head button{width:38px;font-size:23px}
.msg-filters,.msg-sections{display:flex;gap:6px;padding:0 14px 8px}
.msg-filters button{flex:1;border-radius:10px;background:#f1f3f5;font-size:14px;font-weight:700}
.msg-filters button.active{background:#b92824;color:white}
.msg-sections button{flex:1;border-bottom:2px solid transparent;font-size:14px}
.msg-sections button.active{color:#a52320;border-bottom-color:#b92824;font-weight:700}
#msgSearch{width:calc(100% - 28px);margin:0 14px 12px;min-height:42px;background:#f2f4f6;border:1px solid #e1e5ea}
.msg-contact-note{font-size:12px;color:#4d5968;padding:0 14px;margin:0 0 10px}
.msg-thread-list{overflow:auto;flex:1;min-height:0}
.messenger .msg-thread{width:100%;display:flex;gap:12px;align-items:center;padding:14px;text-align:left;border-bottom:1px solid #f0f1f4;border-radius:0}
.msg-thread:hover{background:#f8f5f4}.msg-thread.selected{background:#fbecea}
.msg-avatar{display:grid;place-items:center;flex:0 0 44px;width:44px;height:44px;border-radius:50%;background:#f4dcd8;color:#97211c;font-weight:700;font-size:16px}
.msg-thread-body{min-width:0;flex:1}.msg-thread-top,.msg-thread-bottom{display:flex;gap:6px;align-items:center;justify-content:space-between}
.msg-thread-top strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.msg-thread-top time{font-size:12px;color:#536273;flex-shrink:0}.msg-thread-bottom{margin-top:5px;font-size:13px;color:#536273}
.msg-thread-bottom>span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.msg-count{border-radius:20px;min-width:22px;padding:2px 6px;background:#b92824;color:white;text-align:center;font-size:12px}
.msg-conversation{min-width:0;min-height:0;display:flex;flex-direction:column;background:#f0f2f5}
.msg-conversation-head{display:flex;gap:12px;align-items:center;min-height:76px;padding:12px 18px;border-bottom:1px solid #d9dfe6;background:#fff}
.msg-conversation-head>div{flex:1;min-width:0}.msg-conversation-head strong{font-size:16px;overflow-wrap:anywhere}
.msg-conversation-head small{display:block;color:#536273;font-size:13px}.msg-conversation-head>button{font-size:24px}
.msg-back{display:none}
.msg-history{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:9px;padding:20px}
.msg-bubble{align-self:flex-start;max-width:85%;border:1px solid #e2e5e9;border-radius:14px 14px 14px 4px;padding:10px 13px;background:#fff;color:#182532;overflow-wrap:anywhere;flex-shrink:0}
.msg-bubble.mine{align-self:flex-end;background:#f8e3df;border-color:#f0d2cb;border-radius:14px 14px 4px 14px}
.msg-bubble.system{align-self:center;background:#fff3d1}.msg-author{font-size:12px;font-weight:700;color:#963126;margin-bottom:4px}
.msg-text{white-space:pre-wrap;font-size:15px;line-height:1.5}.msg-time{font-size:11px;text-align:right;color:#536273;margin-top:5px}
.msg-poll{display:grid;gap:7px;margin-top:8px}.msg-poll strong{font-size:14px}.msg-poll button{min-height:36px;padding:7px 10px;border:1px solid #d6a69f;border-radius:10px;background:#fff;color:#8f2823;text-align:left;font-size:13px}.msg-poll button:disabled{opacity:.85;cursor:default}
.msg-date{align-self:center;background:#dce2e8;border-radius:12px;padding:4px 12px;font-size:12px;color:#344254}
.msg-file{display:flex;flex-direction:column;gap:5px;margin-top:8px}.msg-file small{color:#536273}.msg-file button{background:white;border:1px solid #bdc7d2;border-radius:9px;font-size:14px}.msg-uploading{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#fff7e6;border-top:1px solid #f3dfae;color:#7b5a16;font-size:13px;font-weight:700}.msg-uploading .spinner{width:14px;height:14px;border-width:2px}.msg-poll-button{font-size:22px!important;background:#f5e9df!important;color:#9d3026!important}
.msg-media:empty{display:none}.msg-media img,.msg-media video{display:block;max-width:100%;width:280px;max-height:300px;object-fit:contain;border-radius:9px}
.msg-compose{display:flex;align-items:flex-end;gap:8px;padding:10px 14px max(10px,env(safe-area-inset-bottom));border-top:1px solid #d6dce4;background:#fff}
.msg-compose>button{flex:0 0 44px;border-radius:50%;font-size:26px}
.msg-compose .msg-send{background:#b92824;color:white;font-size:22px}
#msgDraft{margin:0;resize:none;min-height:44px;max-height:120px;height:64px;border:1px solid #cbd2db;border-radius:14px;font-size:16px;padding:10px;flex:1}
.msg-empty{color:#526070;padding:24px;text-align:center}.msg-empty button{display:block;margin:8px auto;border:1px solid #b92824;border-radius:8px;padding:6px 14px}
.msg-placeholder{margin:auto;text-align:center;padding:30px;color:#536273}.msg-placeholder>span{font-size:32px;font-weight:800;color:#b92824;letter-spacing:.15em}
.msg-placeholder h2{font-size:20px;color:#253444}.msg-error{padding:10px 16px;background:#fff0eb;color:#9c2520;font-size:14px}
.msg-older{align-self:center;text-decoration:underline;color:#9d2923!important;font-size:14px!important}
body.messenger-view footer{display:none}
@media(max-width:700px){
 body.messenger-conversation .top,body.messenger-conversation #tabs,body.messenger-conversation #notifications{display:none}
 body.messenger-conversation .phone{padding-top:8px}
 body.messenger-view .phone{padding-left:8px;padding-right:8px}
 .messenger{display:flex;border-radius:12px}.msg-sidebar{width:100%;border-right:0}.msg-conversation{display:none;width:100%}
 .messenger.has-conversation .msg-sidebar{display:none}.messenger.has-conversation .msg-conversation{display:flex}
 .msg-back{display:block}.msg-history{padding:12px;gap:8px}.msg-conversation-head{padding:10px;gap:8px;min-height:68px}
 .msg-conversation-head strong{font-size:14px}.msg-conversation-head .msg-avatar{width:36px;height:36px;flex-basis:36px;font-size:13px}
 .msg-bubble{max-width:91%}.msg-compose{padding-left:8px;padding-right:8px}.msg-placeholder{display:none}
}

.msg-new-chat{display:block;width:calc(100% - 24px);margin:0 12px 10px;padding:10px 12px;border-radius:10px;border:1px solid #b92824;color:#a51f1b;background:#fff;font-size:13px;font-weight:700}
</style>

  <script>/* Explicit review mode only, loaded by preview.html. Never forwards requests to 1C. */
(function(){
  window.ITUS_REVIEW_MODE = true;
  const role = new URLSearchParams(location.search).get('role') || 'master';
  const allowedRole = ['master','executor','tech'].includes(role) ? role : 'master';
  window.__ITUS_API_BASE__ = '/review-api';
  window.WebApp = {ready(){},expand(){},platform:'review',user:{id:'900000001'}};
  const messages = [{id:'m1',authorName:'Тестовый клиент',text:'Здравствуйте! Фото прикреплено.',createdAt:'2026-09-24T14:10:15+05:00'},
    {id:'m2',authorName:'Имя из истории',text:'Проверка имени текущего сотрудника',direction:'outgoing',createdAt:'2026-09-24T09:12:18Z'}];
  const events = ['new_messages','executor_assigned','quality_control_requested'].map((type,i)=>({eventId:'review-'+i,type,title:'Проверочное уведомление',message:type,orderRef:'review-order',payload:{unreadCount:3}}));
  let poll = 0;
  let reviewUnread = 3;
  let clientUnread = 1;
  const staffGroups = [{groupRef:'review-group',title:'Передача смены',subtitle:'Все внутренние пользователи',unreadCount:2}];
  const staffMessages = new Map([['review-group',[{id:'shift-message',authorName:'Сотрудник смены',text:'Информация по передаче смены.',createdAt:'2026-09-24T09:10:00Z'}]]]);
  let packageData = {packageRef:'review-existing-package',packageNumber:'УРВ-0007',status:'Не стартовал'};
  const created = new Map();
  const reviewOrder = () => ({orderRef:'review-order',orderNumber:'ЗН-УРВ-001',workshopRef:'review-workshop',vehicle:{model:'Тестовый автомобиль',plate:'А001АА'},worktime:packageData || {}});
  window.fetch = async (url,options={}) => {
    const method = String(url).replace('/review-api','');
    let body={};try {body=JSON.parse(options.body || '{}');}catch{}
    let data = {};
    if(method === '/auth/max') data = {employeeRef:'review-self',workshopRef:'review-workshop',name:'Тестовый сотрудник ИТУС',role:allowedRole,roleName:{master:'Мастер-приёмщик',executor:'Исполнитель',tech:'Технолог'}[allowedRole],availableTabs:['orders','mp','executor','tech','clients','chat']};
    else if(method === '/orders/list') data={orders:allowedRole === 'executor' ? [reviewOrder()] : []};
    else if(method === '/orders/get') data={order:reviewOrder()};
    else if(method.startsWith('/worktime/')) {
      try { window.ITUS_WORKTIME.validateRequest(method,body); }
      catch(error) { return new Response(JSON.stringify({success:false,error:{code:'VALIDATION_ERROR',message:error.message}}),{status:400,headers:{'Content-Type':'application/json'}}); }
      if(method === '/worktime/orders/works') data={workshopRef:'review-workshop',works:[{workRef:'review-work-1',name:'Диагностика',available:true},{workRef:'review-work-2',name:'Замена масла',available:true},{workRef:'review-work-3',name:'Работа с активным пакетом',available:true,hasActivePackage:true,activePackageRef:'other-package'}].filter(work => ![...created.values()].some(entry => entry.workRefs.includes(work.workRef) && entry.package.status !== 'Закрыт'))};
      else if(method === '/worktime/packages/list') data={packages:packageData && packageData.status !== 'Закрыт' ? [packageData] : []};
      else if(method === '/worktime/executors/list') data={executors:[{employeeRef:'review-self',name:'Тестовый сотрудник ИТУС',workshopRef:'review-workshop',available:true},{employeeRef:'review-colleague',name:'Петров Алексей',workshopRef:'review-workshop',available:true}]};
      else if(method === '/worktime/participation/validate') data={valid:true};
      else if(method === '/worktime/packages/create') {
        const signature=JSON.stringify([body.workRefs,body.participants,body.orderRef,body.workshopRef]);
        const previous=created.get(body.clientPackageId);
        if(previous && previous.signature!==signature) return new Response(JSON.stringify({success:false,error:{message:'Состав пакета изменён для прежнего ключа создания'}}),{status:409});
        packageData=previous?.package || {packageRef:'review-package-'+(created.size+1),status:'Создан'};
        created.set(body.clientPackageId,{signature,package:packageData,workRefs:[...body.workRefs]}); data={package:packageData};
      } else if(['/worktime/packages/start','/worktime/packages/pause','/worktime/packages/close'].includes(method)) {
        if(!packageData || packageData.packageRef!==body.packageRef) return new Response(JSON.stringify({success:false,error:{message:'Пакет не найден'}}),{status:404});
        packageData.status=method.endsWith('/start')?'В работе':method.endsWith('/pause')?'Перерыв':'Закрыт';data={package:packageData};
      } else return new Response(JSON.stringify({success:false,error:{message:'Метод не имитируется'}}),{status:404});
    }
    else if(method === '/notifications/poll') data={events:poll++ ? []:events,unreadMessagesCount:reviewUnread,nextCursor:'review-1'};
    else if(method === '/internal-chat/contacts/list') data={contacts:[{employeeRef:'employee-2',name:'Петрова Анна',authorized:true},{employeeRef:'employee-3',name:'Неавторизованный',authorized:false}]};
    else if(method === '/internal-chat/direct/open') {
      const ref='direct-'+body.employeeRef;
      if(!staffGroups.some(group=>group.groupRef===ref)){staffGroups.push({groupRef:ref,title:'Петрова Анна',unreadCount:0});staffMessages.set(ref,[]);}
      data={groupRef:ref};
    }
    else if(method.endsWith('/topics/list') || method.endsWith('/groups/list')) data={topics:[{topicRef:'review-topic',title:'Тестовый клиент',unreadCount:clientUnread}],groups:staffGroups};
    else if(method.endsWith('/messages/read')) {if(method.startsWith('/clients/'))clientUnread=0;else {const group=staffGroups.find(x=>x.groupRef===body.groupRef);if(group)group.unreadCount=0;}reviewUnread=clientUnread+staffGroups.reduce((n,x)=>n+x.unreadCount,0);data={read:true,unreadCount:0,unreadMessagesCount:reviewUnread};}
    else if(method.endsWith('/messages/list')) data={messages:method.startsWith('/internal-chat/')?(staffMessages.get(body.groupRef)||[]):messages};
    else if(method.endsWith('/messages/send') || method.endsWith('/files/send') || method.endsWith('/polls/send')) {
      const targetMessages=method.startsWith('/internal-chat/')?(staffMessages.get(body.groupRef)||[]):messages;
      targetMessages.push({id:String(Date.now()),direction:'outgoing',text:body.text || '',poll:body.poll,createdAt:new Date().toISOString(),attachments:body.file?[body.file]:[]});
    } else if(method.endsWith('/polls/vote')) {
      data={saved:true,messageRef:body.messageRef,option:body.option};
    } else return new Response(JSON.stringify({success:false,error:{message:'Этот сценарий не имитируется. Для проверки с 1С откройте обычную версию.'}}),{status:422});
    return new Response(JSON.stringify({success:true,data}),{headers:{'Content-Type':'application/json'}});
  };
})();
</script>
  <script>/*
  ИТУС — конфигурация локального подключения к тестовой базе 1С.

  При запуске через `npm run dev` приложение обращается к `/api/1c`,
  а Vite автоматически перенаправляет запросы на:
  https://1c.eazia.ru/aa6_ea_test9/ru/hs/max-service/

  ID ботов MAX заполните ниже. Токены ботов и webhook secret должны
  храниться только в 1С.
*/
const runtimeApiBase = (() => {
  if (typeof window === 'undefined') return '/api/1c';
  const explicit = window.__ITUS_API_BASE__ || window.ITUS_API_BASE_URL || '';
  if (explicit) return explicit.replace(/\/$/, '');
  if (window.location.protocol === 'file:') {

      if(!item)return '<div class="msg-placeholder"><span>ИТУС</span><h2>Выберите переписку</h2><p>Клиенты и сотрудники в одном разделе</p></div>';
      const uploadState=sending[k]==='upload';
      return `<header class="msg-conversation-head"><button class="msg-back" data-action="msg-back" aria-label="Назад к чатам">←</button><span class="msg-avatar">${escape(initials(item.title))}</span><div><strong>${escape(item.title)}</strong><small>${escape(item.subtitle||labels[source])}</small></div><button data-action="msg-refresh-messages" aria-label="Обновить сообщения" ${busy[k]?'disabled':''}>↻</button></header>${errors[k]?`<div class="msg-error" role="alert">${escape(errors[k])}</div>`:''}<div class="msg-history" role="log" aria-label="История переписки">${historyHtml()}</div>${uploadState?'<div class="msg-uploading" role="status"><span class="spinner"></span>Загрузка вложения в 1С…</div>':''}<div class="msg-compose"><button data-action="msg-attach" aria-label="Прикрепить файл">＋</button>${source==='clients'?'<button class="msg-poll-button" data-action="msg-poll" aria-label="Создать опрос">☑</button>':''}<textarea id="msgDraft" rows="1" aria-label="Сообщение" placeholder="Сообщение">${escape(drafts[k]||'')}</textarea><button class="msg-send" data-action="msg-send" ${sending[k]?'disabled':''} aria-label="Отправить сообщение">${sending[k]?'…':'➤'}</button></div>`;
    }
    function paint({bottom=false}={}){
      if(!visible)return;
      document.body.classList.toggle('messenger-conversation',Boolean(selected));
      const app=document.getElementById('app');if(!app)return;
      const old=app.querySelector('.msg-history'),oldTop=old?.scrollTop||0;
      const nearBottom=!old || old.scrollHeight-old.scrollTop-old.clientHeight<80;
      revokeMedia();
      app.innerHTML=`<div class="messenger ${selected?'has-conversation':''}"><aside class="msg-sidebar"><div class="msg-sidebar-head"><h2>Чаты</h2><button data-action="msg-settings" aria-label="Настройки уведомлений">⚙</button><button data-action="msg-refresh" aria-label="Обновить список">↻</button></div><div class="msg-filters">${allowed().map(s=>`<button class="${source===s?'active':''}" data-action="msg-source" data-source="${s}">${labels[s]}</button>`).join('')}</div>${source==='staff'?'<button class="msg-new-chat" data-action="msg-new-chat">＋ Новый чат с сотрудником</button>':''}<div class="msg-sections"><button class="${section==='chats'?'active':''}" data-action="msg-section" data-section="chats">Переписки</button><button class="${section==='contacts'?'active':''}" data-action="msg-section" data-section="contacts">Контакты</button></div><input id="msgSearch" type="search" placeholder="Поиск" aria-label="Поиск чатов и контактов" value="${escape(query)}">${section==='contacts'?'<p class="msg-contact-note">Выберите сотрудника, который авторизовался в приложении</p>':''}<div class="msg-thread-list">${listHtml()}</div></aside><section class="msg-conversation">${conversationHtml()}</section></div>`;
      const history=app.querySelector('.msg-history');if(history)history.scrollTop=bottom||nearBottom?history.scrollHeight:oldTop;
      resize();
    }
    async function loadList(s=source){
      if(!permitted(s)||listBusy[s])return;const generation=epoch;listBusy[s]=true;listError[s]='';paint();
      try{
        const response=await call(endpoints(s)+(s==='clients'?'/topics/list':'/groups/list'),s==='clients'?{status:'active'}:{},{silent:true});
        if(epoch!==generation)return;
        records[s]=api.extractItems(response,s==='clients'?['topics']:['groups']).map((raw,i)=>({...api.normalizeTopic(raw,i),shiftGroup:s==='staff'&&String(raw.title||raw.name||'').trim().toLocaleLowerCase('ru-RU')==='передача смены',updatedAt:raw.updatedAt||raw.lastMessage?.createdAt||raw.lastMessageAt||''}));
        if(s==='staff'&&!records.staff.some(x=>x.shiftGroup))listError.staff='1С не вернула обязательную группу «Передача смены»';
        loaded[s]=true;
        if(source===s&&selected&&!records[s].some(x=>x.ref===selected))selected='';
      }catch(e){if(epoch===generation)listError[s]=s==='staff'&&e.status===404?'В 1С не настроен метод сотрудников и группы чата: /internal-chat/groups/list.':e.message;}
      finally{if(epoch===generation){listBusy[s]=false;paint();}}
    }
    async function loadContacts(){
      if(contactsLoaded||listBusy.contacts)return;
      const generation=epoch;listBusy.contacts=true;listError.staff='';paint();
      try{
        const response=await call('/internal-chat/contacts/list',{}, {silent:true});
        if(epoch!==generation)return;
        contacts=api.extractItems(response,['contacts','employees']).filter(x=>x.authorized===true || x.isAuthorized===true).map((raw,i)=>({...api.normalizeTopic(raw,i),employeeRef:String(raw.employeeRef||raw.userRef||raw.id||''),conversationRef:String(raw.conversationRef||raw.groupRef||'')}));
        contactsLoaded=true;
      }catch(e){if(epoch===generation)listError.staff=e.status===404?'В 1С не настроен метод авторизованных сотрудников: /internal-chat/contacts/list.':e.message;}
      finally{if(epoch===generation){listBusy.contacts=false;paint();}}
    }
    async function markRead(s,id,messages){
      const refs=messages.filter(m=>m.side==='theirs' && m.id).map(m=>m.id);
      const item=records[s].find(x=>x.ref===id);
      if(!item || (!item.unread && !refs.length))return;
      const generation = epoch;
      const previousUnread = Number(item.unread) || 0;
      const response = await call(endpoints(s)+'/messages/read',{...params(s,id),messageRefs:refs},{silent:true});
      if (generation !== epoch) return;
      const data = response.data || response;
      const remainingUnread = Number.isFinite(data.unreadCount) && data.unreadCount >= 0 ? data.unreadCount : 0;
      item.unread = remainingUnread;
      options.onRead?.({source:s,ref:id,previousUnread,remainingUnread,totalUnread:data.unreadMessagesCount});
    }
    async function loadMessages(s,id,{force=false}={}){
      const k=key(s,id);if(!permitted(s)||busy[k])return;
      if(!force&&cache[k]){
        try{if(visible && !document.hidden && records[s].find(x=>x.ref===id)?.unread)await markRead(s,id,cache[k]);errors[k]='';}
        catch(e){errors[k]=e.message;}
        paint({bottom:true});return;
      }
      const generation=epoch;busy[k]=true;errors[k]='';paint();
      try{
        const response=await call(endpoints(s)+'/messages/list',{...params(s,id),includeAttachmentContent:false},{silent:true});
        if(epoch!==generation)return;
        cache[k]=api.extractItems(response,['messages']).map(api.normalizeMessage);
        const data=response.data||response;
        const item=records[s].find(x=>x.ref===id);
        if(item){
          const last=cache[k].at(-1);if(last){item.lastMessage=last.text||(last.attachments.length?'Вложение':'');item.updatedAt=last.createdAt||item.updatedAt;}
          if(Number.isFinite(data.unreadCount))item.unread=data.unreadCount;
        }
        if(visible && !document.hidden && source===s&&selected===id)await markRead(s,id,cache[k]);
      }catch(e){if(epoch===generation)errors[k]=e.message;}
      finally{if(epoch===generation){busy[k]=false;if(source===s&&selected===id)paint();}}
    }
    async function open(id){
      if(source==='staff'&&section==='contacts'){
        const contact=contacts.find(x=>x.ref===id);if(!contact || openingContact)return;
        const generation=epoch;openingContact=true;
        try{
          const result=contact.conversationRef?null:await call('/internal-chat/direct/open',{employeeRef:contact.employeeRef},{silent:true});
          if(generation!==epoch)return;
          const ref=contact.conversationRef||String(result?.data?.groupRef||result?.groupRef||'');
          if(!ref)throw new Error('1С не вернула идентификатор личной переписки');
          contact.conversationRef=ref;
          if(!records.staff.some(x=>x.ref===ref))records.staff.push({...contact,ref});
          id=ref;section='chats';
        }catch(e){errors[key(source,id)]=e.message;toast(e.message,true);return;}
        finally{openingContact=false;}
      }
      selected=id;if(!current()){selected='';return paint();}paint({bottom:true});await loadMessages(source,id);
    }
    async function send(file,kind,target){
      const s=target?.source||source,id=target?.ref||selected,k=key(s,id);
      const text=drafts[k]?.trim()||'';
      if(!id||!permitted(s)||(!file&&!text)||sending[k])return;
      const generation=epoch,original=drafts[k];sending[k]=file?'upload':true;errors[k]='';paint();
      try{
        const payload={...params(s,id),clientMessageId:root.crypto.randomUUID?root.crypto.randomUUID():String(Date.now())};
        if(file){payload.file=await filePayload(file,kind);payload.kind=kind;}else payload.text=text;
        if(generation!==epoch)return;
        const response=await call(endpoints(s)+(file?'/files/send':'/messages/send'),payload,{silent:true});
        if(generation!==epoch)return;
      if(!file&&drafts[k]===original)drafts[k]='';
        const data=response.data||response;
        if(data.message&&typeof data.message==='object'){
          // Ответ /send иногда возвращает только messageRef и имя контакта.
          // Для исходящего сообщения автором всегда является текущий пользователь.
          const message=api.normalizeMessage({...data.message,direction:'outgoing',isMine:true,authorName:user()?.name||data.message.authorName,status:data.message.status||'sent'},Date.now());
          cache[k]=[...(cache[k]||[]).filter(x=>x.id!==message.id),message];
          const item=records[s].find(x=>x.ref===id);if(item){item.lastMessage=message.text||'Вложение';item.updatedAt=message.createdAt;}
        }else await loadMessages(s,id,{force:true});
        toast('Отправлено');if(file)closeSheet();
      }catch(e){if(generation===epoch){errors[k]=e.message;toast(e.message,true);}}
      finally{if(generation===epoch){sending[k]=false;paint({bottom:true});}}
    }
    async function media(mi,fi){
      let file=cache[selectedKey()]?.[mi]?.attachments?.[fi];if(!file)return;
      const slot=document.getElementById(`msg-media-${mi}-${fi}`);if(!slot)return;
      let url=safeUrl(file.downloadUrl);const mime=file.mimeType||'application/octet-stream';
      if(!url&&!file.contentBase64&&file.fileRef){
        try{
          const response=await call(endpoints(source)+'/messages/list',{...params(source,selected),includeAttachmentContent:true,attachmentRef:file.fileRef},{silent:true});
          const fresh=api.extractItems(response,['messages']).map(api.normalizeMessage);
          if(fresh.length){cache[selectedKey()]=fresh;file=cache[selectedKey()]?.[mi]?.attachments?.[fi]||file;url=safeUrl(file.downloadUrl);}
        }catch(e){return toast('Не удалось загрузить вложение: '+e.message,true);}
      }
      if(!url&&file.contentBase64){
        const k=selectedKey()+':'+mi+':'+fi;url=blobUrls.get(k);
        if(!url){try{const raw=atob(file.contentBase64.replace(/^data:[^,]*,/,''));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));url=URL.createObjectURL(new Blob([bytes],{type:mime}));blobUrls.set(k,url);}catch{return toast('Не удалось прочитать вложение',true);}}
      }
      if(!url)return toast('1С не передала ссылку или содержимое файла',true);
      if(/^video\//.test(mime)){const v=document.createElement('video');v.controls=true;v.playsInline=true;v.preload='none';v.src=url;slot.replaceChildren(v);v.play()?.catch(()=>{});}
      else if(/^image\//.test(mime)){const img=document.createElement('img');img.src=url;img.alt=file.fileName;slot.replaceChildren(img);}
      else{const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.download=file.fileName;a.click();}
    }
    function back(){if(!visible||!selected)return false;selected='';paint();return true;}
    async function enter(preferred){visible=true;if(preferred&&permitted(preferred)&&source!==preferred){source=preferred;selected='';}if(!permitted(source))source=allowed()[0]||'clients';paint();if(!loaded[source])await loadList();}
    async function handle(action,button){
      if(action==='msg-new-chat'){if(!permitted('staff'))return;source='staff';section='contacts';selected='';query='';contactsLoaded=false;paint();await loadContacts();return;}
      if(action==='msg-source'){const s=button.dataset.source;if(!permitted(s))return;source=s;section='chats';selected='';query='';paint();if(!loaded[s])await loadList(s);}
      if(action==='msg-section'){section=button.dataset.section;paint();if(section==='contacts'&&source==='staff')await loadContacts();}
      if(action==='msg-open')await open(button.dataset.ref);
      if(action==='msg-back')back();
      if(action==='msg-refresh'){if(section==='contacts'&&source==='staff'){contactsLoaded=false;await loadContacts();}else await loadList();}
      if(action==='msg-refresh-messages')await loadMessages(source,selected,{force:true});
      if(action==='msg-send')await send();
      if(action==='msg-older'){const h=document.querySelector('.msg-history'),oldHeight=h?.scrollHeight||0;counts[selectedKey()]=(counts[selectedKey()]||50)+50;paint();const n=document.querySelector('.msg-history');if(n)n.scrollTop=n.scrollHeight-oldHeight;}
      if(action==='msg-media')await media(Number(button.dataset.mi),Number(button.dataset.fi));
      if(action==='msg-settings')options.settings();
      if(action==='msg-attach'){
        options.sheet('Вложения','Куда: '+current().title,`<div class="grid"><button data-action="msg-photo">Фото: камера или галерея</button><button data-action="msg-video">Видео из галереи</button><button data-action="msg-file">Документ</button></div>`);
      }
      if(action==='msg-poll') options.sheet('Опрос согласования','Ответ клиента будет сохранён в 1С',`<label for="msgPollQuestion">Вопрос</label><input id="msgPollQuestion" value="Согласовано ли выполнение работ?" maxlength="200"><p class="tiny">Варианты: «Согласовано» и «Не согласовано»</p><button class="primary" data-action="msg-poll-send">Отправить опрос</button>`);
      if(action==='msg-poll-send'){
        const question=String(document.getElementById('msgPollQuestion')?.value||'').trim();
        if(!question)return toast('Введите вопрос для опроса',true);
        const s=source,id=selected,k=key(s,id);sending[k]=true;paint();
        try{
          const result=await call('/clients/polls/send',{...params('clients',id),clientMessageId:root.crypto.randomUUID?root.crypto.randomUUID():String(Date.now()),kind:'poll',messageType:'poll',poll:{question,options:['Согласовано','Не согласовано']}},{silent:true});
          const data=result.data||result;if(data.message){cache[k]=[...(cache[k]||[]),api.normalizeMessage(data.message,Date.now())];}else await loadMessages(s,id,{force:true});
          options.closeSheet();toast('Опрос отправлен клиенту');
        }catch(e){errors[k]=e.message;toast(e.message,true);}finally{sending[k]=false;paint({bottom:true});}
      }
      if(action==='msg-poll-vote'){
        if(source!=='clients'||!selected)return;
        try{await call('/clients/polls/vote',{...params('clients',selected),messageRef:button.closest('.msg-bubble')?.dataset?.messageRef||'',option:button.dataset.value},{silent:true});await loadMessages('clients',selected,{force:true});toast('Ответ сохранён');}
        catch(e){toast(e.message,true);}
      }
      const target={type:'messenger',source,ref:selected};
      if(action==='msg-photo')photo({...target,kind:'photo'});
      if(action==='msg-video')pickFile({...target,kind:'video'},'video/*');
      if(action==='msg-file')pickFile({...target,kind:'file'},'*/*');
    }
    document.addEventListener('input',e=>{
      if(!visible)return;
      if(e.target.id==='msgDraft')drafts[selectedKey()]=e.target.value;
      if(e.target.id==='msgSearch'){query=e.target.value;const list=document.querySelector('.msg-thread-list');if(list)list.innerHTML=listHtml();}
    });
    return {enter,paint,back,handle,upload:(file,target)=>send(file,target.kind,target),
      leave(){visible=false;document.body.classList.remove('messenger-conversation');revokeMedia();},
      reset(){epoch++;visible=false;document.body.classList.remove('messenger-conversation');revokeMedia();records={clients:[],staff:[]};contacts=[];contactsLoaded=false;loaded={};listBusy={};listError={};cache={};busy={};errors={};drafts={};sending={};counts={};selected='';query='';},
      async notify(event){if(event.type==='new_messages'){loaded.clients=false;loaded.staff=false;/* список обновится при открытии, чтобы не грузить чат на каждом пинге */}}
    };
  }
  root.ITUS_MESSENGER={create,safeUrl};
})(typeof window==='undefined'?globalThis:window);
</script>

}

  <script>(() => {
  'use strict';

  const PREFIX = '[ITUS v2.6.3]';
  const BOT_KEY = 'itus.max.botIds.v263';
  const LAST_UNREAD_KEY = 'itus.max.lastUnread.v263';
  const SW_URL = './notification-sw.js';

  const log = (...a) => console.info(PREFIX, ...a);
  const text = el => String(el?.textContent || '').replace(/\s+/g, ' ').trim();

  function walkForKey(value, key, seen = new WeakSet()) {
    if (!value || typeof value !== 'object') return { found: false, value: '' };
    if (seen.has(value)) return { found: false, value: '' };
    seen.add(value);
    if (Object.prototype.hasOwnProperty.call(value, key)) {
      return { found: true, value: value[key] == null ? '' : String(value[key]) };
    }
    for (const v of Array.isArray(value) ? value : Object.values(value)) {
      const hit = walkForKey(v, key, seen);
      if (hit.found) return hit;
    }
    return { found: false, value: '' };
  }

  function saveBotIdsFromPayload(payload) {
    const c = walkForKey(payload, 'clientBotId');
    const s = walkForKey(payload, 'serviceBotId');
    if (!c.found && !s.found) return false;

    const ids = {
      clientBotId: c.found ? c.value.trim() : '',
      serviceBotId: s.found ? s.value.trim() : ''
    };

    sessionStorage.setItem(BOT_KEY, JSON.stringify(ids));
    window.dispatchEvent(new CustomEvent('itus:bot-ids-updated', { detail: ids }));
    return true;
  }

  function getBotIds() {
    try { return JSON.parse(sessionStorage.getItem(BOT_KEY) || '{}'); }
    catch { return {}; }
  }

  const originalFetch = window.fetch.bind(window);
  window.fetch = async function(input, init) {
    const requestInit = init ? { ...init } : {};
    const method = String(
      requestInit.method || (input instanceof Request ? input.method : 'GET')
    ).toUpperCase();

    if (method !== 'GET' && method !== 'HEAD') {
      const ids = getBotIds();
      const hasIds = Object.prototype.hasOwnProperty.call(ids, 'clientBotId') ||
                     Object.prototype.hasOwnProperty.call(ids, 'serviceBotId');

      if (hasIds && typeof requestInit.body === 'string') {
        const ct = new Headers(
          requestInit.headers || (input instanceof Request ? input.headers : undefined)
        ).get('content-type') || '';

        if (ct.includes('application/json') || /^[\s]*[\{\[]/.test(requestInit.body)) {
          try {

    if (state.error) return $('app').innerHTML = `<div class="card"><h2>Нет подключения к 1С</h2><p class="muted">${esc(state.error)}</p><div class="grid two"><button data-action="retry-init">Повторить</button><button data-action="settings">Настройки</button></div></div>`;
    if (state.view === 'chat' && messenger) { messenger.enter(); return; }
    const renderers = { orders: renderOrdersView, mp: renderMpView, executor: renderExecutorView, tech: renderTechView, clients: renderClientsView, chat: renderChatView };
    $('app').innerHTML = (renderers[state.view] || renderOrdersView)();
  }

  function orderCard(order) {
    return `<button class="order ${state.selectedOrderId === order.id ? 'active' : ''}" data-action="select-order" data-ref="${escAttr(order.orderRef || order.id)}"><div class="row"><b>ЗН ${esc(order.num)} · ${esc(order.plate)}</b><span class="badge ${statusClass(order.status)}">${esc(order.status)}</span></div><div class="tiny">${esc(order.car)} · ${esc(order.client)}</div><div class="tiny">Исполнитель: ${esc(order.executor)} · дефекты: ${Number(order.counters?.defects || order.defects?.length || 0)}</div></button>`;
  }

  function renderOrderList() {
    const query = state.search.toLowerCase().trim();
    const orders = state.orders.filter(o => !query || [o.num,o.plate,o.car,o.client,o.status].join(' ').toLowerCase().includes(query));
    return `<div class="card"><label for="orderSearch">Поиск заказ-наряда</label><input id="orderSearch" value="${escAttr(state.search)}" placeholder="ЗН, госномер, клиент"><div class="grid two"><button data-action="scan-order-qr">Сканировать QR</button><button data-action="refresh-orders">Обновить из 1С</button></div></div>${orders.length ? orders.map(orderCard).join('') : '<div class="card empty">1С не вернула доступные заказ-наряды или ничего не найдено.</div>'}`;
  }

  function renderSelectedCard() {
    const order = currentOrder();
    if (!order) return '<div class="card empty">Выберите заказ-наряд для продолжения.</div>';
    const defectRef = order.defectDocumentRef || order._defectSheet?.documentRef;
    const defectCell = defectRef
      ? `<button class="stat stat-button" data-action="open-defect-chat" title="Открыть историю дефектовки"><span class="tiny">Дефектовка</span><br><b>Создана</b><span class="tiny">Открыть историю</span></button>`
      : `<div class="stat"><span class="tiny">Дефектовка</span><br><b>Не создана</b></div>`;
    const packageLabel = order.packageNumber ? `${order.packageNumber} · ${order.packageStatus}` : order.packageStatus;
    return `<div class="card"><div class="row"><h2>ЗН ${esc(order.num)}</h2><span class="badge ${statusClass(order.status)}">${esc(order.status)}</span></div><p><b>${esc(order.car)}</b> · ${esc(order.plate)}</p><p class="tiny">${esc(order.client)}${order.contact ? ` / ${esc(order.contact)}` : ''}</p>${order.reason ? `<p class="reason"><b>Причина обращения:</b><br>${esc(order.reason)}</p>` : ''}<div class="summary"><div class="stat"><span class="tiny">Пост</span><br><b>${esc(order.post)}</b></div><div class="stat"><span class="tiny">Исполнитель</span><br><b>${esc(order.executor)}</b></div><button class="stat stat-button" data-action="package-select" title="Выбрать незакрытый пакет работ"><span class="tiny">Пакет УРВ</span><br><b>${esc(packageLabel)}</b><span class="tiny">Выбрать пакет</span></button>${defectCell}</div></div>`;
  }

  function renderOrdersView() {
    return renderOrderList() + renderSelectedCard() + (currentOrder() ? `<div class="card"><h2>Меню заказ-наряда</h2><div class="grid two"><button data-action="view" data-view="mp">Раздел МП</button><button data-action="view" data-view="executor">Исполнитель</button><button data-action="view" data-view="tech">Технолог</button><button data-action="view" data-view="clients">B2B с клиентом</button><button data-action="view" data-view="chat">Чат отделов</button><button data-action="load-order">Обновить карточку</button></div></div>` : '');
  }

  function acceptanceHasPhoto(order = currentOrder()) {
    const acceptanceEntries = order?._acceptance?.entries || [];
    return acceptanceEntries.some(entry => entry.type === 'photo' && entry.file);
  }

  function processProgress(process, processKey) {
    if (processKey === '_acceptance') {
      const fields = (process.form?.fields || []).filter(field => field.required && /mileage|odometer|пробег/i.test(field.id));
      const questions = (process.survey?.questions || []).filter(question => question.required);
      const photoRequired = process.photo?.required !== false;
      const total = fields.length + questions.length + Number(photoRequired);
      const done = fields.filter(field => answered(process.values?.[field.id])).length
        + questions.filter(question => answered(process.answers?.[question.id])).length
        + Number(photoRequired && acceptanceHasPhoto());
      return { done, total, pct: total ? Math.round(done / total * 100) : 0 };
    }
    const fields = process.form?.fields || [];
    const questions = process.survey?.questions || [];
    const total = fields.length + questions.length;
    const fieldDone = fields.filter(field => answered(process.values?.[field.id])).length;
    const questionDone = questions.filter(question => answered(process.answers?.[question.id])).length;
    return { done: fieldDone + questionDone, total, pct: total ? Math.round((fieldDone + questionDone) / total * 100) : 0 };
  }

  function answered(value) {
    if (Array.isArray(value)) return value.length > 0;
    return value !== undefined && value !== null && String(value).trim() !== '';
  }

    function renderField(processKey, field, process) {
        const value = process.values?.[field.id] ?? field.value ?? '';

        const isEmpty =
            value == null ||
            value === false ||
            String(value).trim() === '';

        const error = Boolean(
            field.required && (isEmpty || process.errors?.has(`field:${field.id}`))
        );

        const label = `${esc(field.label)}${field.required ? ' <span class="required">*</span>' : ''}${field.unit ? `, ${esc(field.unit)}` : ''}`;

        if (field.type === 'select') {
            return `<label>${label}</label><select class="${error ? 'field-error' : ''}" data-process-input="${processKey}" data-field="${escAttr(field.id)}"><option value="">Выберите значение</option>${(field.options || []).map(option => `<option value="${escAttr(option.value)}" ${String(value) === String(option.value) ? 'selected' : ''}>${esc(option.label)}</option>`).join('')}</select>${error ? '<div class="error-text">Поле обязательно</div>' : ''}`;
        }

        const tag = field.type === 'textarea' ? 'textarea' : 'input';
        const type = field.type === 'textarea' ? '' : ` type="${field.type}"`;
        const inputId = `field-${processKey}-${field.id}`;
        const textControl = tag === 'textarea'
            ? `<textarea id="${inputId}"${type} class="${error ? 'field-error' : ''}" data-process-input="${processKey}" data-field="${escAttr(field.id)}" placeholder="${escAttr(field.placeholder ?? '')}">${esc(String(value ?? ''))}</textarea>`
            : `<input id="${inputId}"${type} class="${error ? 'field-error' : ''}" data-process-input="${processKey}" data-field="${escAttr(field.id)}" placeholder="${escAttr(field.placeholder ?? '')}" value="${escAttr(String(value ?? ''))}">`;

        return `<label>${label}</label>${textControl}${error ? '<div class="error-text">Поле обязательно</div>' : ''}`;
    }

  function renderQuestion(processKey, question, process) {
    const value = process.answers?.[question.id];
    const done = answered(value);
    const error = process.errors?.has(`question:${question.id}`);
    const heading = `<div class="question-title">${esc(question.text)}${question.required ? ' <span class="required">*</span>' : ''}</div>${question.hint ? `<div class="tiny">${esc(question.hint)}</div>` : ''}`;
    if (['text','textarea','number'].includes(question.type)) {
      const tag = question.type === 'textarea' ? 'textarea' : 'input';
      const type = question.type === 'textarea' ? '' : ` type="${question.type}"`;
      const inputId = `question-${processKey}-${question.id}`;
      const textControl = tag === 'textarea'
        ? `<textarea id="${inputId}"${type} data-process-answer="${processKey}" data-question="${escAttr(question.id)}">${esc(value || '')}</textarea>`
        : `<input id="${inputId}"${type} data-process-answer="${processKey}" data-question="${escAttr(question.id)}" value="${escAttr(value || '')}">`;
      return `<div class="question ${done ? 'done' : ''} ${error ? 'field-error' : ''}">${heading}${textControl}${error ? '<div class="error-text">Ответ обязателен</div>' : ''}</div>`;
    }
    const options = question.type === 'boolean' && !question.options.length ? [{value:'true',label:'Да'},{value:'false',label:'Нет'}] : question.options;
    if (question.type === 'select') return `<div class="question ${done ? 'done' : ''} ${error ? 'field-error' : ''}">${heading}<select data-process-answer="${processKey}" data-question="${escAttr(question.id)}"><option value="">Выберите ответ</option>${options.map(option => `<option value="${escAttr(option.value)}" ${String(value) === String(option.value) ? 'selected' : ''}>${esc(option.label)}</option>`).join('')}</select>${error ? '<div class="error-text">Ответ обязателен</div>' : ''}</div>`;
    return `<div class="question ${done ? 'done' : ''} ${error ? 'field-error' : ''}">${heading}<div class="answers">${options.map(option => { const selected = Array.isArray(value) ? value.includes(option.value) : String(value ?? '') === String(option.value); return `<button class="answer ${selected ? 'selected' : ''}" data-action="answer-option" data-process="${processKey}" data-question="${escAttr(question.id)}" data-value="${escAttr(option.value)}" data-type="${question.type}">${selected ? '✓ ' : ''}${esc(option.label)}</button>`; }).join('')}</div>${error ? '<div class="error-text">Ответ обязателен</div>' : ''}</div>`;
  }

  function renderProcess(processKey, process, completeAction, completeLabel) {
    if (!process?.active) return '';
    const progress = processProgress(process, processKey);
    const hasContent = (process.form?.fields?.length || 0) + (process.survey?.questions?.length || 0) > 0;
    return `<div class="card" data-process-card="${processKey}"><div class="section-title"><div><h2>${esc(process.survey?.title || process.form?.title || 'Форма из 1С')}</h2><div class="tiny">Документ 1С: ${esc(process.documentRef || 'ссылка не возвращена')}</div></div><span data-process-progress class="badge ${progress.done === progress.total && progress.total ? 'ok' : 'warn'}">${progress.done}/${progress.total}</span></div>${process.form?.hint ? `<p class="muted">${esc(process.form.hint)}</p>` : ''}${process.survey?.hint ? `<p class="muted">${esc(process.survey.hint)}</p>` : ''}<div class="progress"><span data-process-bar style="width:${progress.pct}%"></span></div>${hasContent ? (process.form.fields.map(field => renderField(processKey, field, process)).join('') + process.survey.questions.map(question => renderQuestion(processKey, question, process)).join('')) : '<div class="empty">1С создала документ, но не вернула схему полей и вопросов. Продолжение заблокировано.</div>'}${processKey === '_acceptance' ? renderAcceptancePhoto(process) : ''}<button class="primary" data-action="${completeAction}" ${!hasContent || state.busy ? 'disabled' : ''}>${esc(completeLabel)}</button></div>`;
  }

  function renderAcceptancePhoto(process) {
    const done = acceptanceHasPhoto();
    const required = process.photo?.required !== false;
    return `<div class="question ${done ? 'done' : ''} ${!done && process.errors?.has('photo') ? 'field-error' : ''}"><div class="question-title">Фотография автомобиля${required ? ' <span class="required">*</span>' : ''}</div><p class="tiny">${done ? 'Фотография отправлена в 1С' : 'Отправьте фотографию через окно «Приём».'}</p><button data-action="open-acceptance-photo">Приём</button>${!done && process.errors?.has('photo') ? '<div class="error-text">Отправьте хотя бы одну фотографию</div>' : ''}</div>`;
  }

  function updateProcessProgress(processKey) {
    if (processKey !== '_acceptance') return;
    const process = currentOrder()?.[processKey];
    if (!process) return;
    const card = document.querySelector(`[data-process-card="${processKey}"]`);
    if (!card) return;
    const progress = processProgress(process, processKey);
    const badge = card.querySelector('[data-process-progress]');
    badge.textContent = `${progress.done}/${progress.total}`;
    badge.classList.toggle('ok', progress.total > 0 && progress.done === progress.total);
    badge.classList.toggle('warn', !progress.total || progress.done !== progress.total);
    card.querySelector('[data-process-bar]').style.width = `${progress.pct}%`;
  }

  function renderMpView() {
    const order = currentOrder();
    if (!order) return renderSelectedCard();
    return renderSelectedCard() + `<div class="card"><h2>Действия МП</h2><div class="grid two"><button data-action="start-acceptance">Приём автомобиля</button><button data-action="open-acceptance-photo">Приём</button><button data-action="choose-post">Выбрать пост</button><button data-action="assign-executor">Назначить исполнителя</button></div></div>` + renderProcess('_acceptance', order._acceptance, 'complete-acceptance', 'Завершить приём');
  }

  function renderExecutorView() {
    const order = currentOrder();
    if (!order) return renderSelectedCard();
    const packageReady = Boolean(order.packageRef) && !/закрыт|closed/i.test(order.packageStatus);
    const packageRunning = /в работе|работает|started|running/i.test(order.packageStatus);
    return renderSelectedCard() + `<div class="card"><h2>Действия исполнителя</h2><div class="grid two"><button data-action="start-executor-work">Начать работу</button><button data-action="open-defect-chat">Добавить дефект</button><button data-action="package-create">Создать пакет УРВ</button><button data-action="package-start" ${!packageReady || packageRunning ? 'disabled' : ''}>Старт</button><button data-action="package-pause" ${!packageReady || !packageRunning ? 'disabled' : ''}>Пауза</button><button data-action="package-close" ${!packageReady ? 'disabled' : ''}>Закрыть</button><button data-action="production">Выработка</button></div></div>` + renderProcess('_checklist', order._checklist, 'complete-checklist', 'Завершить контрольный лист');
  }

  function renderTechView() {
    const order = currentOrder();
    if (!order) return renderSelectedCard();
    return renderSelectedCard() + `<div class="card"><h2>Действия технолога</h2><div class="grid two"><button data-action="open-defect-chat">Приём</button><button data-action="start-quality">Выходной контроль</button><button data-action="current-appeal">Текущее обращение</button><button data-action="service-history">История обслуживания</button></div></div>` + renderProcess('_quality', order._quality, 'complete-quality', 'Завершить выходной контроль');
  }

  function topicButton(topic, selected, type) {
    return `<button class="topic ${selected === topic.ref ? 'active' : ''}" data-action="select-${type}-topic" data-ref="${escAttr(topic.ref)}"><div class="topic-title"><span>${esc(topic.title)}</span>${topic.unread ? `<span class="badge bad">${topic.unread}</span>` : ''}</div><div class="topic-preview">${esc(topic.subtitle || topic.lastMessage || 'Нет сообщений')}</div>${topic.orderNumber || topic.vehiclePlate ? `<div class="topic-preview">ЗН ${esc(topic.orderNumber)} · ${esc(topic.vehiclePlate)}</div>` : ''}</button>`;
  }

  function attachmentImageSource(file) {
    if (!file || !/^image\//i.test(file.mimeType || '')) return '';
    if (file.previewUrl || file.downloadUrl) return file.previewUrl || file.downloadUrl;
    if (!file.contentBase64) return '';
    return String(file.contentBase64).startsWith('data:')
      ? file.contentBase64
      : `data:${file.mimeType};base64,${file.contentBase64}`;
  }

  function renderAttachment(file) {
    const source = attachmentImageSource(file);
    const preview = source ? `<img class="attachment-preview" src="${escAttr(source)}" alt="${escAttr(file.fileName)}" loading="lazy">` : '';
    return `<div class="attachment">${preview}<span>📎 ${esc(file.fileName)}</span></div>`;
  }

  function renderMessages(messages) {
    if (!messages?.length) return '<div class="empty">Сообщений пока нет.</div>';
    return `<div class="chat">${messages.map(message => `<div class="message ${message.side}"><span class="message-meta">${esc(message.side === 'mine' ? (state.user?.name || message.author) : message.author)} · ${esc(FEATURES.dateTime(message.createdAt))}</span>${esc(message.text)}${message.attachments?.length ? `<div class="attachments">${message.attachments.map(renderAttachment).join('')}</div>` : ''}</div>`).join('')}</div>`;
  }

  function renderClientsView() {
    const topic = state.clientTopics.find(item => item.ref === state.selectedClientTopic);
    const messages = topic ? (state.clientMessages[topic.ref] || []) : [];
    return `<div class="card"><div class="section-title"><h2>B2B: клиенты</h2><button class="button" data-action="load-client-topics">Обновить</button></div><p class="muted">Все исходящие и входящие сообщения проходят через 1С.</p><div class="topic-list">${state.clientTopics.length ? state.clientTopics.map(item => topicButton(item, state.selectedClientTopic, 'client')).join('') : '<div class="empty">Темы не загружены или отсутствуют.</div>'}</div></div>${topic ? `<div class="card"><div class="section-title"><div><h2>${esc(topic.title)}</h2><div class="tiny">${esc(topic.subtitle)}</div></div><button class="button" data-action="refresh-client-messages">Обновить</button></div>${renderMessages(messages)}<label for="clientMessage">Сообщение клиенту</label><textarea id="clientMessage" placeholder="Введите сообщение"></textarea><button class="primary" data-action="send-client-message">Отправить через 1С</button><div class="grid three" style="margin-top:8px"><button data-action="client-photo">Фото</button><button data-action="client-video">Видео</button><button data-action="client-file">Файл</button></div></div>` : ''}`;
  }

  function renderChatView() {
    const group = state.chatGroups.find(item => item.ref === state.selectedChatGroup);
    const messages = group ? (state.chatMessages[group.ref] || []) : [];
    return `<div class="card"><div class="section-title"><h2>Чат между отделами</h2><button class="button" data-action="load-chat-groups">Обновить</button></div><p class="muted">Состав групп, права и история переписки загружаются из 1С.</p><div class="topic-list">${state.chatGroups.length ? state.chatGroups.map(item => topicButton(item, state.selectedChatGroup, 'chat')).join('') : '<div class="empty">Группы не загружены или отсутствуют.</div>'}</div></div>${group ? `<div class="card"><div class="section-title"><div><h2>${esc(group.title)}</h2><div class="tiny">${esc(group.subtitle)}</div></div><button class="button" data-action="refresh-chat-messages">Обновить</button></div>${renderMessages(messages)}<label for="chatMessage">Сообщение в группу</label><textarea id="chatMessage" placeholder="Введите сообщение"></textarea><button class="primary" data-action="send-chat-message">Отправить через 1С</button><div class="grid three" style="margin-top:8px"><button data-action="chat-photo">Фото</button><button data-action="chat-video">Видео</button><button data-action="chat-file">Файл</button></div></div>` : ''}`;
  }

  function validateProcess(process, allRequired = true) {
    process.errors = new Set();
    for (const field of process.form?.fields || []) if ((allRequired || field.required) && !answered(process.values?.[field.id])) process.errors.add(`field:${field.id}`);
    for (const question of process.survey?.questions || []) if ((allRequired || question.required) && !answered(process.answers?.[question.id])) process.errors.add(`question:${question.id}`);
    return process.errors.size === 0;
  }

  async function startAcceptance() {
    const order = currentOrder(); if (!order || state.busy) return;
    if (order._acceptance?.active) return render();
    state.busy = true; toast('Создаём акт приёма в 1С…');
    try {
      const response = await call1C('/acceptance/start', orderPayload());
      order._acceptance = API.normalizeProcess(response, 'acceptance');
      // Use values already displayed from the 1C form in both validation and submission.
      for (const field of order._acceptance.form.fields) {
        if (order._acceptance.values[field.id] === undefined) order._acceptance.values[field.id] = field.value;
      }
      render(); toast('Акт приёма создан, анкета загружена из 1С');
    } finally { state.busy = false; render(); }
  }

  async function completeAcceptance() {
    const order = currentOrder(), process = order?._acceptance; if (!process) return;
    validateProcess(process, false);
    if (process.photo?.required !== false && !acceptanceHasPhoto(order)) process.errors.add('photo');
    if (process.errors.size) { render(); toast('Заполните обязательные поля, ответы и отправьте фотографию, если она обязательна', true); return; }
    state.busy = true; render();
    try {
      await call1C('/acceptance/complete', orderPayload({ documentRef: process.documentRef, formValues: process.values, surveyRef: process.survey.surveyRef, surveyVersion: process.survey.version, answers: process.answers }));
      const mileageField = process.form.fields.find(f => /mileage|пробег/i.test(f.id));
      const hoursField = process.form.fields.find(f => /engineHours|hours|моточас/i.test(f.id));
      const reasonField = process.form.fields.find(f => /reason|appeal|причин/i.test(f.id));
      if (mileageField) order.mileage = String(process.values[mileageField.id] || '');
      if (hoursField) order.engineHours = String(process.values[hoursField.id] || '');
      if (reasonField) order.reason = String(process.values[reasonField.id] || '');
      order._acceptance = null; await loadSingleOrder(order.orderRef); render(); toast('Приём завершён, данные сохранены в 1С');
    } finally { state.busy = false; render(); }
  }

  async function choosePost() {
    showSheet('Выбор поста', 'Получаем посты согласно правам пользователя', '<div class="loading"><span class="spinner"></span>Загрузка из 1С…</div>');
    try {
      const response = await call1C('/resources/posts/list', orderPayload());
      const items = API.extractItems(response, ['posts']).map(API.normalizeResource);
      $('sheetBody').innerHTML = items.length ? `<div class="grid">${items.map(item => `<button data-action="set-post" data-ref="${escAttr(item.ref)}" data-name="${escAttr(item.name)}" ${item.available ? '' : 'disabled'}><b>${esc(item.name)}</b>${item.description ? `<br><span class="tiny">${esc(item.description)}</span>` : ''}</button>`).join('')}</div>` : '<div class="empty">1С не вернула доступные посты.</div>';
    } catch (error) { $('sheetBody').innerHTML = `<div class="empty">${esc(error.message)}</div>`; }
  }

  async function setPost(ref, name) {
    const order = currentOrder(); if (!order) return;
    await call1C('/resources/posts/assign', orderPayload({ postRef: ref }));
    order.postRef = ref; order.post = name; closeSheet(); render(); toast('Пост назначен');
  }

  async function assignExecutor(other = false) {
    showSheet('Назначить исполнителя', other ? 'Все доступные сотрудники согласно правам пользователя' : 'В первую очередь показаны запланированные ресурсы', '<div class="loading"><span class="spinner"></span>Загрузка из 1С…</div>');
    try {
      const method = other ? '/resources/executors/list' : '/resources/executors/planned/list';
      const response = await call1C(method, orderPayload({ postRef: currentOrder()?.postRef || '' }));
      const items = API.extractItems(response, ['executors','employees','plannedExecutors']).map(API.normalizeResource);

  async function preparePackage() {
    if (!currentOrder() || state.busy) return;
    // Preserve an uncertain creation attempt rather than issuing a new ID.
    if (worktimeDraft?.sent && worktimeDraft.context.orderRef === (currentOrder().orderRef || currentOrder().id)) return renderWorktimeStep();
    state.busy = true;
    const context = orderPayload();
    worktimeDraft = null;
    showSheet('Создание пакета УРВ', 'Получаем работы без активных пакетов', '<p>Загрузка…</p>');
    try {
      const response = await call1C('/worktime/orders/works', {...context, withoutActivePackages:true});
      const data = response.data || response;
      const workshopRef = String(data.workshopRef || currentOrder()?.workshopRef || state.user?.workshopRef || '');
      if (!workshopRef) throw new Error('1С не вернула цех для заказ-наряда');

  async function worktimeStep(action) {
    const d = worktimeDraft; if (!d || d.busy || state.busy || d.sent) return;
    try {
      if ((currentOrder()?.orderRef || currentOrder()?.id) !== d.context.orderRef) throw new Error('Заказ-наряд изменился. Откройте форму заново');
      if (action === 'worktime-works-next') {
        d.workRefs = [...$('sheetBody').querySelectorAll('[data-worktime-work]:checked')].map(el => el.dataset.worktimeWork);
        if (!d.workRefs.length) throw new Error('Выберите хотя бы одну работу');
        if (d.workRefs.some(ref => !d.works.some(x => x.ref === ref))) throw new Error('Выбрана недоступная работа');
        d.busy = true; state.busy = true;
        const response = await call1C('/worktime/executors/list', {...d.context,workshopRef:d.workshopRef});
        d.employees = API.extractItems(response,['executors','employees']).filter(x => x.available !== false && (!x.workshopRef || String(x.workshopRef) === d.workshopRef)).map(x => ({ref:String(x.employeeRef || x.ref || ''),name:String(x.name || x.fullName || x.employeeRef || '')})).filter(x => x.ref);
        d.employeeRefs = d.employeeRefs.filter(ref => d.employees.some(x => x.ref === ref));
        d.step = 'employees';
      } else if (action === 'worktime-self' || action === 'worktime-employees-next') {
        d.employeeRefs = action === 'worktime-self' ? [state.user?.employeeRef] : [...$('sheetBody').querySelectorAll('[data-worktime-employee]:checked')].map(el => el.dataset.worktimeEmployee);
        if (!d.employeeRefs.length || d.employeeRefs.some(ref => !d.employees.some(x => x.ref === ref))) throw new Error('Выберите доступных исполнителей');
        d.participants = d.employeeRefs.length === 1 ? [{employeeRef:d.employeeRefs[0],percent:100}] : d.participants.filter(p => d.employeeRefs.includes(p.employeeRef));
        d.step = d.employeeRefs.length === 1 ? 'confirm' : 'shares';
      } else if (action === 'worktime-shares-equal') {
        const totalCents = 10000, count = d.employeeRefs.length;
        const base = Math.floor(totalCents / count), remainder = totalCents - base * count;
        d.participants = d.employeeRefs.map((employeeRef, index) => ({employeeRef, percent:(base + (index < remainder ? 1 : 0)) / 100}));
      } else if (action === 'worktime-shares-next') {
        const values = new Map([...$('sheetBody').querySelectorAll('[data-worktime-percent]')].map(el => [el.dataset.worktimePercent,Number(el.value)]));
        d.participants = window.ITUS_WORKTIME.participation(d.employeeRefs.map(employeeRef => ({employeeRef,percent:values.get(employeeRef)})));
        d.step = 'confirm';
      } else if (action === 'worktime-back-works') d.step = 'works';
      else if (action === 'worktime-back-employees') d.step = 'employees';
      renderWorktimeStep();
    } catch(error) { $('worktimeError').textContent = error.message; }
    finally { d.busy = false; state.busy = false; }
  }

  function normalizeWorktimePackage(item) {
    const status = item?.status?.title || item?.status?.name || item?.statusTitle || (typeof item?.status === 'string' ? item.status : '') || item?.status?.code || 'Не стартовал';
    return { packageRef:String(item?.packageRef || item?.ref || item?.id || ''), number:String(item?.packageNumber || item?.number || item?.name || ''), status:String(status) };
  }

  function availablePackages(order, remote = []) {
    const current = order.packageRef ? [{packageRef:order.packageRef, packageNumber:order.packageNumber, status:order.packageStatus}] : [];

      .filter((item, index, all) => item.packageRef && !/закрыт|closed/i.test(item.status) && all.findIndex(x => x.packageRef === item.packageRef) === index);

      const checked = await call1C('/worktime/participation/validate',payload);

  function downloadFile(file) {
    if (file.downloadUrl) {
      const link = document.createElement('a'); link.href = file.downloadUrl; link.target = '_blank'; link.rel = 'noopener'; link.download = file.fileName || ''; link.click(); return;
    }
    if (!file.contentBase64) return toast('Файл не содержит данных для скачивания', true);
    const bytes = Uint8Array.from(atob(file.contentBase64), char => char.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: file.mimeType || 'application/octet-stream' }));
    const link = document.createElement('a'); link.href = url; link.download = file.fileName || 'document.pdf'; link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  const pendingDefectSheets = new Map();
  const hasDocumentRef = ref => Boolean(String(ref || '').trim()) && !/^0{8}-0{4}-0{4}-0{4}-0{12}$/.test(String(ref));
  async function ensureDefectSheet(order = currentOrder(), {refreshExisting = false} = {}) {
    if (!order) throw new Error('Выберите заказ-наряд');
    if (hasDocumentRef(order._defectSheet?.documentRef)) return order._defectSheet;
    const ref = order.orderRef || order.id;
    if (pendingDefectSheets.has(ref)) return pendingDefectSheets.get(ref);
    const attach = process => {
      if (!hasDocumentRef(process.documentRef)) throw new Error('1С не вернула ссылку на дефектовочную ведомость. Файл не отправлен.');
      for (const item of [order, ...state.orders.filter(item => (item.orderRef || item.id) === ref)]) {
        item._defectSheet = process; item.defectDocumentRef = process.documentRef;
      }
      return process;
    };
    const existing = (documentRef, entries) => attach(API.normalizeProcess({documentRef, entries:entries || []}, 'defectSheet'));
    if (!refreshExisting && hasDocumentRef(order._defectSheet?.documentRef)) return order._defectSheet;
    if (!refreshExisting && hasDocumentRef(order.defectDocumentRef)) return existing(order.defectDocumentRef, order.defects);
    const pending = (async () => {
      // Read the current order first; a stale list must not trigger creation.
      const response = await call1C('/orders/get', {orderRef:ref,orderId:ref});
      const fresh = API.mapOrder(response.order || response.data?.order || response.data || response);
      if ((fresh.orderRef || fresh.id) !== ref) throw new Error('Не удалось проверить действующий документ выбранного ЗН');
      const existingRef = fresh.defectDocumentRef || order.defectDocumentRef || order._defectSheet?.documentRef || '';
      if (!refreshExisting && hasDocumentRef(existingRef)) return existing(existingRef, fresh.defects || order.defects);
      const started = await call1C('/defects/start', {orderRef:ref,orderId:ref,existingDocumentRef:existingRef});
      const process = API.normalizeProcess(started, 'defectSheet');
      if (!process.entries.length && Array.isArray(fresh.defects)) process.entries = API.normalizeProcess({entries:fresh.defects}, 'defectSheet').entries;
      return attach(process);
    })();
    pendingDefectSheets.set(ref,pending);
    try { return await pending; } finally { pendingDefectSheets.delete(ref); }
  }

  function renderDefectSheet() {
    const order = currentOrder(), sheet = order?._defectSheet;
    if (!sheet) return;
    const entries = sheet.entries || [];
    const entryHtml = entries.length ? entries.map((entry, index) => {
      const file = entry.file;
      const fileButton = file ? `<button class="entry-file" data-action="defect-media" data-index="${index}"><span class="file-icon">${entry.type === 'video' ? '🎥' : '📷'}</span><span><b>${esc(file.fileName)}</b><br><span class="tiny">Открыть вложение</span></span></button>` : '';
      return `<div class="entry"><div class="entry-head"><span>${esc(entry.author || 'Сотрудник')}</span><span>${esc(FEATURES.dateTime(entry.createdAt))}</span></div>${entry.text ? `<div>${esc(entry.text)}</div>` : ''}${fileButton}</div>`;
    }).join('') : '<div class="empty">По этому ЗН ранее добавленных дефектов нет.</div>';

  function openDefectMedia(index) {

    const mime = file.mimeType || 'application/octet-stream';
    let url = file.downloadUrl;
    if (!url && file.contentBase64) {
      try {
        const raw = atob(file.contentBase64.replace(/^data:[^,]*,/, ''));
        const bytes = Uint8Array.from(raw, c => c.charCodeAt(0));
        url = URL.createObjectURL(new Blob([bytes], {type:mime}));
      } catch { return toast('Не удалось открыть вложение', true); }
    }
    if (!url) return toast('1С не передала ссылку или содержимое файла', true);
    if (/^image\//.test(mime)) showSheet('Фото дефекта', file.fileName, `<img src="${esc(url)}" alt="${esc(file.fileName)}" style="max-width:100%;border-radius:12px">`);

    else { const link=document.createElement('a'); link.href=url; link.download=file.fileName||'attachment'; link.target='_blank'; link.click(); }

  async function fileToPayload(file, kind) {
    let blob = file;
    if (kind === 'photo' && /^image\//.test(file.type)) blob = await compressImage(file);
    if (blob.size > CONFIG.maxUploadBytes) throw new Error(`Файл превышает лимит ${Math.round(CONFIG.maxUploadBytes / 1024 / 1024)} МБ`);
    const dataUrl = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(blob); });
    const mimeType = blob.type || file.type || 'application/octet-stream';
    const originalName = file.name || `${kind}-${Date.now()}`;
    const imageExtension = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif' }[mimeType];
    const fileName = kind === 'photo' && imageExtension
      ? `${originalName.replace(/\.[^.]*$/, '') || `photo-${Date.now()}`}.${imageExtension}`
      : originalName;
    return { fileName, mimeType, sizeBytes: blob.size, contentBase64: String(dataUrl).split(',')[1], clientFileId: requestId() };
  }

  async function compressImage(file) {
    if (file.size < 900 * 1024) return file;
    let image;
    try {
      if (typeof createImageBitmap === 'function') image = await createImageBitmap(file);
      else {
        const url = URL.createObjectURL(file);
        try { image = await new Promise((resolve,reject) => {
          const img = new Image(); img.onload=()=>resolve(img); img.onerror=reject; img.src=url;
        }); } finally { URL.revokeObjectURL(url); }
      }
    } catch { return file; } // Unsupported phone format: retain original file and size checks.
    const max = 1600, scale = Math.min(1, max / Math.max(image.width, image.height));
    const canvas = document.createElement('canvas'); canvas.width = Math.round(image.width * scale); canvas.height = Math.round(image.height * scale);
    canvas.getContext('2d').drawImage(image, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', .82));
    image.close?.(); return blob || file;
  }

  async function pollNotifications() {
    const types = FEATURES.typesFor(state.user);
    if (!state.userId || !state.initialized || !types.length || state.polling) return;
    const userId = state.userId;
    const unreadRevision = state.unreadRevision;
    state.polling = true;
    try {
      // Лёгкий запрос: 1С возвращает только новые события и счётчики.
      // История чатов, документы и медиа здесь не запрашиваются.
      const response = await call1C('/notifications/poll', {
        cursor: state.notificationCursor, limit: 5, light: true, onlyUnread: true,
        includeChatHistory: false, role: state.user.roleName || state.user.role,
        roleName: state.user.roleName || '',
        types, ...(types.length === 1 ? {type:types[0]} : {}),
        includeUnreadCount: types.includes('new_messages'),
        botId: state.clientBotId
      }, { silent:true });
      if (state.userId !== userId) return;
      const data = response.data || response;
      const count = FEATURES.unread(data);
      if (count !== null && state.unreadRevision === unreadRevision) state.unreadMessages = count;
      state.notificationCursor = String(data.nextCursor || data.cursor || state.notificationCursor || '');
      const prefs = FEATURES.preferences(userId);
      for (const raw of API.extractItems(response, ['events','notifications'])) {
        const type = String(raw.type || raw.eventType || '');
        if (!types.includes(type)) continue;
        const event = {eventId:String(raw.eventId || raw.id || JSON.stringify(raw)), type,
          title:String(raw.title || 'Уведомление из 1С'),message:String(raw.message || raw.text || ''),
          orderRef:String(raw.orderRef || raw.orderId || raw.payload?.orderRef || ''),payload:raw.payload || {}};
        if (state.seenEvents.has(event.eventId)) continue;
        if (type === 'new_messages' && count === null && state.unreadRevision === unreadRevision) {
          const eventCount = FEATURES.unread(raw.payload || raw);
          if (eventCount !== null) state.unreadMessages = eventCount;
        }
        state.seenEvents.add(event.eventId);
        if (state.seenEvents.size > 2000) state.seenEvents.delete(state.seenEvents.values().next().value);
        await messenger?.notify(event);
        if (!prefs[type]) continue;
