# Для сайта ea-itus.ru: вставить ВЫШЕ всех location /login, /auth и обычного location /.
# Иначе запрос /p/max-service/ будет перехвачен сайтом и редиректится на /login/?next=/p/max-service/.

location = /p/max-service {
    return 308 /p/max-service/$is_args$args;
}

location ^~ /p/max-service/ {
    auth_request off;
    auth_basic off;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /p/max-service;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
    client_max_body_size 32m;
}
