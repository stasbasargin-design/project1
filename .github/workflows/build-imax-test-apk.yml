name: Build I-MAX TEST APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/web-push-ios-yandex
    paths:
      - .github/workflows/build-imax-test-apk.yml

permissions:
  contents: read

jobs:
  test-apk:
    name: Isolated TEST APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-max/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Create isolated TEST project
        run: |
          cp -a app-max "$RUNNER_TEMP/imax-test"
          cd "$RUNNER_TEMP/imax-test"
          rm -f android/app/google-services.json
          node <<'NODE'
          const fs = require('fs');
          const path = 'capacitor.config.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.appId = 'ru.eazia.imax.test';
          config.appName = 'I-MAX TEST';
          delete config.server;
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE
          sed -i \
            -e 's/applicationId "ru\.eazia\.imax"/applicationId "ru.eazia.imax.test"/' \
            -e 's/versionCode 2705/versionCode 27053/' \
            -e 's/versionName "2\.7\.5"/versionName "2.7.5-webpush-test"/' \
            android/app/build.gradle
          sed -i \
            -e 's/>I-MAX</>I-MAX TEST</g' \
            -e 's/ru\.eazia\.imax/ru.eazia.imax.test/g' \
            -e 's/i-max-events/i-max-test-events/g' \
            android/app/src/main/res/values/strings.xml
          sed -i '1i window.__ITUS_API_BASE__ = "https://max-test.ea-itus.ru/api/1c";\nwindow.__ITUS_TEST_BUILD__ = "27053";' config/itus.config.js
          sed -i "s/version: 'i-max-2.7.5'/version: 'i-max-2.7.5-test-27053'/" assets/app.js

      - name: Test web application
        working-directory: ${{ runner.temp }}/imax-test
        run: |
          npm ci
          npm test
          npm run build
          rm -rf node_modules/@capacitor/push-notifications
          npx cap sync android

      - name: Build unsigned Firebase-free TEST APK
        working-directory: ${{ runner.temp }}/imax-test/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Verify packaged TEST values
        working-directory: ${{ runner.temp }}/imax-test
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          MERGED_MANIFEST="$(find android/app/build/intermediates/merged_manifests/debug -name AndroidManifest.xml | head -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          unzip -p "$APK" assets/capacitor.config.json | tee packaged-capacitor.config.json
          grep -F "package: name='ru.eazia.imax.test'" apk-badging.txt
          grep -F "versionCode='27053'" apk-badging.txt
          grep -F "versionName='2.7.5-webpush-test'" apk-badging.txt
          grep -F "application-label:'I-MAX TEST'" apk-badging.txt
          grep -F 'https://max-test.ea-itus.ru/api/1c' android/app/src/main/assets/public/config/itus.config.js
          ! grep -Fq 'https://ea-itus.ru/p/max-service/api/1c' android/app/src/main/assets/public/config/itus.config.js
          grep -F 'android:name="ru.eazia.imax.MainActivity"' "$MERGED_MANIFEST"
          test -f android/app/src/main/java/ru/eazia/imax/MainActivity.java
          ! unzip -l "$APK" | grep -q 'google-services.json'

      - uses: actions/upload-artifact@v4
        with:
          name: I-MAX-TEST-2.7.5-webpush-test-28eb72d6-debug
          path: |
            ${{ runner.temp }}/imax-test/android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/imax-test/apk-badging.txt
            ${{ runner.temp }}/imax-test/packaged-capacitor.config.json
          if-no-files-found: error

  smoke-test:
    name: Android emulator smoke test (non-blocking APK artifact)
    needs: test-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: I-MAX-TEST-2.7.5-webpush-test-28eb72d6-debug
          path: smoke-input

      - name: Smoke-test packaged TEST APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set -Eeuo pipefail
            DIAG="$GITHUB_WORKSPACE/android-smoke-diagnostics.txt"
            LOG="$GITHUB_WORKSPACE/android-smoke-log.txt"
            trap 'adb devices -l >> "$DIAG" 2>&1 || true; adb logcat -d >> "$LOG" 2>&1 || true' EXIT
            APK="$(find smoke-input -name app-debug.apk -print -quit)"
            adb devices -l | tee "$DIAG"
            adb wait-for-device
            for i in $(seq 1 30); do test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 && break; sleep 2; done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
            adb install -r "$APK" 2>&1 | tee -a "$DIAG"
            adb logcat -c
            LAUNCHER="$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER ru.eazia.imax.test | tr -d '\r')"
            printf 'resolved_launcher=%s\n' "$LAUNCHER" | tee -a "$DIAG"
            adb shell am start -W -n "$LAUNCHER" 2>&1 | tee -a "$DIAG"
            sleep 8
            PID="$(adb shell pidof ru.eazia.imax.test | tr -d '\r')"
            test -n "$PID"
            adb logcat -d > "$LOG"
            ! grep -A12 -B3 'Process: ru.eazia.imax.test' "$LOG" | grep -q 'FATAL EXCEPTION'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: I-MAX-TEST-android-smoke-diagnostics
          path: |
            android-smoke-log.txt
            android-smoke-diagnostics.txt
          if-no-files-found: warn
