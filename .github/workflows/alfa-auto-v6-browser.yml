name: Alfa-Auto Trainer V6 QA (27 scenarios)
on:
  workflow_dispatch:
  push:
    branches:
      - alfa-auto-simulator-v6-20261119
    paths:
      - 'alfa-auto-simulator-v6/**'
      - '.github/workflows/alfa-auto-v6-browser.yml'
permissions:
  contents: read
jobs:
  trainer-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: JavaScript syntax
        run: node --check alfa-auto-simulator-v6/src/app.js
      - name: Verify reproducible standalone bundle
        run: |
          python alfa-auto-simulator-v6/build.py
          git diff --exit-code -- alfa-auto-simulator-v6/AlfaAuto_Trainer_v6.html
      - name: Install browser dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Previous quote, booking and repair checks (9)
        run: python alfa-auto-simulator-v6/qa/test_v4_regression.py
      - name: CRM and automatic quote checks (12)
        run: python alfa-auto-simulator-v6/qa/test_v5_browser.py
      - name: Document links, OZCH workflow and print checks (6)
        run: python alfa-auto-simulator-v6/qa/test_v6_workflows.py
      - name: Upload QA reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alfa-auto-v6-qa
          path: |
            alfa-auto-simulator-v6/qa/*.png
            alfa-auto-simulator-v6/qa/*results.json