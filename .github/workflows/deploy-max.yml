name: Deploy MAX Service

on:
  push:
    branches:
      - main
    paths:
      - "app-max/**"
      - ".github/workflows/deploy-max.yml"

  workflow_dispatch:

concurrency:
  group: max-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-max
    env:
      IMAX_BUILD_SHA: ${{ github.sha }}
      REQUIRE_BROWSER_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-max/package-lock.json
      - name: Require browser regressions
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run test:review
      - run: npm run build
  deploy:
    name: Deploy exact commit to Timeweb
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TIMEWEB_SSH_KEY }}
          SSH_HOST: ${{ secrets.TIMEWEB_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy MAX Service
        env:
          SSH_HOST: ${{ secrets.TIMEWEB_HOST }}
          SSH_USER: ${{ secrets.TIMEWEB_USER }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]
          ssh "$SSH_USER@$SSH_HOST" \
            "sudo /usr/local/bin/deploy-max.sh '$DEPLOY_SHA'"
