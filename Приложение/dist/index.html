<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b92824">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ИТУС">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ИТУС — управление сервисом</title>
  <link rel="stylesheet" href="./assets/app.css">
  <link rel="stylesheet" href="./assets/modern.css">
  <link rel="icon" type="image/png" href="./assets/itus-logo.png">
  <script>window.WebApp = window.WebApp || {ready(){},expand(){},close(){},platform:"web"};</script>
  <script src="./config/itus.config.js"></script>
  <script src="./assets/api-normalizers.js"></script>
</head>
<body>
  <div class="brand-rail" aria-hidden="true"></div>
  <main class="phone">
    <header class="top">
      <div class="logo"><img src="./assets/itus-logo.png" alt="Логотип ИТУС"></div>
      <div class="product">
        <h1>ИТУС</h1>
        <p>информационные технологии управления сервисом</p>
      </div>
      <button class="user-panel" id="userPanel" type="button" aria-label="Профиль и подключение к 1С"></button>
    </header>
    <nav class="tabs" id="tabs" aria-label="Разделы приложения"></nav>
    <section id="notifications"></section>
    <section id="app" aria-live="polite"></section>
    <footer><span id="connectionStatus" class="connection-status" role="status" aria-live="polite">Связь с 1С ещё не проверена</span>ИТУС · данные, анкеты, документы и сообщения синхронизируются с 1С Альфа-Авто 6.1.</footer>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet">
      <div class="sheet-head">
        <div><h2 id="sheetTitle">Раздел</h2><p id="sheetHint"></p></div>
        <button class="icon-button" id="closeSheetButton" type="button" aria-label="Закрыть">×</button>
      </div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>
  <input id="filePicker" class="hidden" type="file">
  <script src="./assets/app.js"></script>
</body>
</html>
