# Insert ONLY these locations inside the existing HTTPS server block for ea-itus.ru.
# IMPORTANT: place them BEFORE the main /login or /auth and before a generic location / block.
# Otherwise the domain-level auth layer will redirect /p/max-service/ to /login/ before our app is reached.
# Keep the site's existing TLS, root, other locations and authentication settings.
location = /p/max-service {
    return 308 /p/max-service/$is_args$args;
}
location ^~ /p/max-service/ {
    # Приложение использует собственную авторизацию пользователя через 1С.
    # Не наследовать страницу входа основного сайта для интерфейса и API.
    auth_request off;
    auth_basic off;
    # Override inherited camera=() for THIS application only.
    proxy_hide_header Permissions-Policy;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_redirect off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /p/max-service;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
    client_max_body_size 32m;
}
