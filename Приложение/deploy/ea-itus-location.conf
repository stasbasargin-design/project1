# Insert ONLY these locations inside the existing HTTPS server block for ea-itus.ru.
# Keep the site's existing TLS, root, other locations and authentication settings.
location = /p/max-service {
    return 308 /p/max-service/$is_args$args;
}
location ^~ /p/max-service/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 90s;
    client_max_body_size 32m;
}
